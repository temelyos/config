packages:
  - 'packages/*'

catalog:
  tsx:  ^4.23.15
  turbo: ^2.11.10
  typescript: ^7.0.2

catalogs:
  eslint:
    "@eslint/js": ^9.39.5
    "@stylistic/eslint-plugin": ^5.10.0
    eslint-plugin-import: ^2.32.0
    eslint-plugin-perfectionist: ^5.13.0
    eslint-plugin-react: 7.37.5
    globals: ^17.14.0
    typescript-eslint: ^8.72.1
    "@typescript-eslint/parser": ^8.72.1
    "@typescript-eslint/utils": 8.72.1
    eslint: ^9.39.5

  minimist:
    "@types/minimist": ^1.2.5
    minimist: ^1.2.8

  node:
    "@types/node": ^26.6.6

  oxlint:
    "@oxlint/plugins": ^1.92.0
    oxlint: ^1.92.0
    oxlint-tsgolint: ^7.0.2006

  # typescript-eslint needs TypeScript's JS API, which TS7 does not ship, so eslint-config keeps
  # the TS6 compat package under the name it resolves its `typescript` peer from.
  typescript6:
    typescript: npm:@typescript/typescript6@^6.0.2
